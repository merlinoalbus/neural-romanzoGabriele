services:
  romanzo_gabriele_be:
    image: ghcr.io/merlinoalbus/romanzo-gabriele-neural-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: romanzo_gabriele_be
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - PORT=3001
      - PROJECT_ID=${PROJECT_ID:-romanzo-gabriele}
      - APP_ENV=${APP_ENV:-production}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_SHARED_SECRET=${MCP_SHARED_SECRET:?MCP_SHARED_SECRET_required}
      - MCP_EDITOR_URL=http://romanzo_gabriele_mcp:3002
      - NEO4J_URI=bolt://romanzo_gabriele_neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in the stack environment}

    depends_on:
      romanzo_gabriele_neo4j:
        condition: service_healthy
    user: "1000:1000"
    networks:
      - romanzo_gabriele_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-romanzo-gabriele-neural}"

  romanzo_gabriele_fe:
    image: ghcr.io/merlinoalbus/romanzo-gabriele-neural-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: romanzo_gabriele_fe
    restart: unless-stopped
    ports:
      - "${FE_HOST_PORT:-3000}:80"
    depends_on:
      romanzo_gabriele_be:
        condition: service_healthy
    networks:
      - romanzo_gabriele_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-romanzo-gabriele-neural}"

  romanzo_gabriele_mcp:
    image: ghcr.io/merlinoalbus/romanzo-gabriele-neural-mcp:latest
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: romanzo_gabriele_mcp
    restart: unless-stopped
    ports:
      - "${MCP_HOST_PORT:-3002}:3002"
    environment:
      - PROJECT_ID=${PROJECT_ID:-romanzo-gabriele}
      - APP_ENV=${APP_ENV:-production}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_PORT=3002
      - MCP_SHARED_SECRET=${MCP_SHARED_SECRET:?MCP_SHARED_SECRET_required}
      - MCP_SSE_KEEPALIVE_MS=${MCP_SSE_KEEPALIVE_MS:-25000}
      - MCP_SESSION_TTL_MS=${MCP_SESSION_TTL_MS:-1800000}
      - MCP_SESSION_CLEANUP_INTERVAL_MS=${MCP_SESSION_CLEANUP_INTERVAL_MS:-300000}
      - BACKEND_URL=http://romanzo_gabriele_be:3001
      - NEO4J_URI=bolt://romanzo_gabriele_neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in the stack environment}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-openai-compatible}
      - EMBEDDINGS_API_KEY=${EMBEDDINGS_API_KEY:-ollama-local}
      - EMBEDDINGS_BASE_URL=${EMBEDDINGS_BASE_URL:-http://romanzo_gabriele_ollama:11434/v1}
      # I vettori vengono comunque troncati a 1536 dimensioni (MRL): il 4B a 1536d perde pochissimo
      # rispetto all'8B troncato ed e' molto piu veloce per embedding. Dopo un cambio di modello il
      # backfill (kg_backfill_embeddings, missingOnly:true) re-embedda automaticamente i nodi che
      # hanno ancora vettori del modello precedente.
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-qwen3-embedding-4b-ctx8k}
      - EMBEDDINGS_DIMENSIONS=${EMBEDDINGS_DIMENSIONS:-1536}
      - EMBEDDINGS_TIMEOUT_MS=${EMBEDDINGS_TIMEOUT_MS:-30000}
      # Testi per singola richiesta al provider negli embed in batch (array input OpenAI-compatible).
      - EMBEDDINGS_BATCH_SIZE=${EMBEDDINGS_BATCH_SIZE:-32}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-}
      - EDITING_STATE_DIR=/app/.state/chapter-editing
    volumes:
      - "romanzo_gabriele_mcp_state:/app/.state"
    depends_on:
      romanzo_gabriele_be:
        condition: service_healthy
      romanzo_gabriele_neo4j:
        condition: service_healthy
    networks:
      - romanzo_gabriele_network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-romanzo-gabriele-neural}"

  romanzo_gabriele_neo4j:
    image: neo4j:5-community
    container_name: romanzo_gabriele_neo4j
    restart: unless-stopped
    # Resta a 1 replica: Neo4j Community non supporta clustering. Repliche multiple sullo stesso
    # volume corromperebbero il database (scrittore singolo); su volumi separati diventerebbero
    # due grafi indipendenti e divergenti. Un vincolo tecnico, non una scelta di configurazione.
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in the stack environment}
      - HEALTHCHECK_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in the stack environment}
      - NEO4J_dbms_security_auth__minimum__password__length=16
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=1G
      # 2G tiene grafo + indice vettoriale interamente in memoria: le traversate neighbors a
      # profondita' 2 e le query vettoriali non toccano il disco a regime.
      - NEO4J_server_memory_pagecache_size=2G
      - NEO4J_server_jvm_additional=--add-modules=jdk.incubator.vector
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p \"$${HEALTHCHECK_PASSWORD}\" \"RETURN 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - "romanzo_gabriele_neo4j_data:/data"
    networks:
      - romanzo_gabriele_network

  romanzo_gabriele_ollama:
    image: ollama/ollama:latest
    container_name: romanzo_gabriele_ollama
    restart: unless-stopped
    # Resta a 1 replica: una sola GPU fisica (RTX 4080) e' disponibile sull'host, e non puo'
    # essere prenotata in esclusiva da due container contemporaneamente. Vincolo hardware, non
    # una scelta di configurazione.
    expose:
      - "11434"
    environment:
      # Modello di embedding sempre caricato in VRAM: nessuna latenza di reload tra una chiamata e l'altra.
      - OLLAMA_KEEP_ALIVE=-1
      # RTX 4080 (Ada Lovelace) supporta flash attention: meno VRAM, throughput piu alto.
      - OLLAMA_FLASH_ATTENTION=1
      # Un solo modello di embedding in uso: nessun altro da tenere caricato in memoria.
      - OLLAMA_MAX_LOADED_MODELS=1
      # Fino a 4 richieste servite in parallelo dallo stesso modello caricato: una query di
      # semantic search non deve mettersi in coda dietro un backfill in corso.
      - OLLAMA_NUM_PARALLEL=4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    volumes:
      - "romanzo_gabriele_ollama_data:/root/.ollama"
    networks:
      - romanzo_gabriele_network

  romanzo_gabriele_ollama_init:
    image: ollama/ollama:latest
    container_name: romanzo_gabriele_ollama_init
    restart: "no"
    environment:
      - OLLAMA_HOST=http://romanzo_gabriele_ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull qwen3-embedding:4b &&
      ollama create qwen3-embedding-4b-ctx8k -f /Modelfile.embeddings"
    volumes:
      - "./ollama/Modelfile.embeddings:/Modelfile.embeddings:ro"
    depends_on:
      romanzo_gabriele_ollama:
        condition: service_healthy
    networks:
      - romanzo_gabriele_network

  watchtower:
    image: containrrr/watchtower:latest
    container_name: romanzo_gabriele_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.40}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=120
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_SCOPE=${WATCHTOWER_SCOPE:-romanzo-gabriele-neural}
    labels:
      - "com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-romanzo-gabriele-neural}"
    networks:
      - romanzo_gabriele_network

networks:
  romanzo_gabriele_network:
    driver: bridge

volumes:
  romanzo_gabriele_neo4j_data:
  romanzo_gabriele_mcp_state:
  romanzo_gabriele_ollama_data:
