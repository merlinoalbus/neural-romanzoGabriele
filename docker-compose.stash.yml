# =============================================================================
# Stack stash - GPU NVENC (RTX 5080) + NFS + proxy, con libreria recuperata
# =============================================================================
# Immagine stash-nvenc-patches: build con patch NVENC per hw acceleration.
# FIX GPU: rimossa la riga duplicata NVIDIA_VISIBLE_DEVICES=void che
# sovrascriveva =all e disabilitava la GPU (residuo del setup NAS senza GPU).
# Dopo il deploy: Settings > System > FFmpeg -> abilita Hardware acceleration.
# =============================================================================

services:
  stash:
    image: ghcr.io/rufftruffles/stash-nvenc-patches:latest
    container_name: stash
    runtime: nvidia
    hostname: stash
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      # WSL2: le librerie NVENC/NVDEC stanno in /usr/lib/wsl/lib ma Docker
      # Desktop non le monta di default nei container. Le rendiamo visibili
      # a ffmpeg montandole (vedi volumes) e aggiungendole a LD_LIBRARY_PATH.
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
      - TZ=Europe/Rome
      - USER=apps
      - STASH_PORT=9999
      # cache e generated su volume LOCALE (NFS scrive a 14 MB/s -> collo di
      # bottiglia). metadata resta su NFS (piccolo, si scrive di rado).
      - STASH_CACHE=/local/cache/
      - STASH_GENERATED=/local/generated/
      - STASH_METADATA=/data/stash-rw/metadata/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - stash_config:/root/.stash
      - nas_media:/data/nas:ro
      - nas_stash_rw:/data/stash-rw:rw
      - stash_blobs:/blobs
      # cache + generated su volume LOCALE veloce (non NFS)
      - stash_local:/local
      # Librerie NVENC/NVDEC dal driver WSL, in sola lettura
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
    user: "0:0"
    networks:
      - proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true

volumes:
  stash_config:
    external: true

  # Volume locale veloce per cache/generated (evita scrittura NFS a 14 MB/s)
  stash_local:

  nas_media:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=100.125.101.31,rw,nfsvers=4,hard,timeo=600,retrans=2,noatime,nconnect=4"
      device: ":/Volume1/public/homes_roberto"

  nas_stash_rw:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=100.125.101.31,rw,nfsvers=4,hard,timeo=600,retrans=2,noatime,nconnect=4"
      device: ":/Volume1/public/homes_roberto/App/stash/stash-rw"

  stash_blobs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=100.125.101.31,rw,nfsvers=4,hard,timeo=600,retrans=2,noatime,nconnect=4"
      device: ":/Volume1/public/homes_roberto/App/stash/blobs"
